name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Отменять предыдущие запуски в той же ветке/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test (.NET)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Оркестратор целиком; Testcontainers поднимает Postgres в Docker раннера.
      - name: Orchestrator
        run: dotnet test src/Orchestrator/YukiVA.Orchestrator.slnx --configuration Release --filter "Category!=Manual"

      # Логика клиента без WPF (WPF на Linux не собирается).
      - name: Client core
        run: dotnet test src/Client/YukiVA.Client.Core.Tests --configuration Release
